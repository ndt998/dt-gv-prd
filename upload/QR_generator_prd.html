<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tạo Mã QR PRD</title>

  <style>
    :root {
      --bg: #F5F7F2;
      --surface: #FFFFFF;
      --line: #E2E8DC;
      --ink: #212B1F;
      --muted: #67745E;
      --green: #2F7A4D;
      --green-deep: #1C5435;
      --green-light: #EBF3EE;
      --radius: 16px;
      --radius-sm: 10px;
      --shadow: 0 4px 12px rgba(33,43,31,.08);
      --shadow-hover: 0 8px 24px rgba(33,43,31,.12);
      --font-ui: "Segoe UI", Roboto, Arial, sans-serif;
      --font-display: Georgia, "Times New Roman", serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font-ui);
      background: var(--bg);
      color: var(--ink);
      font-size: 15px;
      line-height: 1.6;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px 16px;
      -webkit-font-smoothing: antialiased;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 34px 28px;
      width: 100%;
      max-width: 520px;
      text-align: center;
      position: relative;
    }

    .kicker {
      font-size: 12.5px;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: var(--muted);
      font-weight: 700;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    h1 {
      font-family: var(--font-display);
      font-size: 27px;
      color: var(--green-deep);
      margin-bottom: 22px;
      line-height: 1.3;
    }

    .form-group {
      text-align: left;
      margin-bottom: 16px;
    }

    .form-label {
      display: block;
      color: var(--muted);
      font-weight: 600;
      font-size: 13.5px;
      margin-bottom: 6px;
    }

    .form-input {
      width: 100%;
      padding: 11px 14px;
      font-size: 14.5px;
      font-family: var(--font-ui);
      color: var(--ink);
      background: #FAFCF9;
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      outline: none;
      transition: all .2s ease;
    }

    .form-input:focus {
      background: #FFFFFF;
      border-color: var(--green);
      box-shadow: 0 0 0 3px rgba(47, 122, 77, 0.12);
    }

    .form-input::placeholder {
      color: #9DAA96;
    }

    .filename-box {
      font-size: 12px;
      color: var(--muted);
      margin-top: 5px;
      display: flex;
      align-items: center;
      gap: 4px;
      word-break: break-all;
    }

    .filename-highlight {
      color: var(--green-deep);
      font-weight: 600;
      background: var(--green-light);
      padding: 2px 6px;
      border-radius: 4px;
    }

    .preview-container {
      background: #FAFBF9;
      border: 1px dashed var(--line);
      border-radius: var(--radius);
      padding: 20px;
      margin: 20px 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .canvas-wrapper {
      position: relative;
      display: inline-block;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 3px 10px rgba(33,43,31,0.08);
      background: #ffffff;
      padding: 10px;
    }

    #qrPreviewCanvas {
      display: block;
      width: 230px;
      height: 230px;
      image-rendering: -webkit-optimize-contrast;
      image-rendering: crisp-edges;
    }

    .btn-group {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 16px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-family: var(--font-ui);
      font-size: 14.5px;
      font-weight: 600;
      padding: 12px 18px;
      border-radius: var(--radius-sm);
      cursor: pointer;
      border: 1px solid transparent;
      transition: all .2s ease;
      text-decoration: none;
      user-select: none;
    }

    .btn-primary {
      background: var(--green);
      color: #FFFFFF;
      box-shadow: 0 2px 6px rgba(47, 122, 77, 0.25);
    }

    .btn-primary:hover:not(:disabled) {
      background: var(--green-deep);
      box-shadow: 0 4px 10px rgba(28, 84, 53, 0.3);
      transform: translateY(-1px);
    }

    .btn-secondary {
      background: #FFFFFF;
      border-color: var(--line);
      color: var(--ink);
    }

    .btn-secondary:hover:not(:disabled) {
      background: var(--bg);
      border-color: #D1D8C9;
    }

    .btn:disabled {
      opacity: 0.55;
      cursor: not-allowed;
      transform: none !important;
    }

    .logo-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 6px;
      font-size: 12.5px;
      color: var(--muted);
    }

    .link-action {
      color: var(--green);
      font-weight: 600;
      text-decoration: underline;
      cursor: pointer;
    }

    .badge-tag {
      font-size: 11px;
      padding: 1px 7px;
      border-radius: 10px;
      background: var(--green-light);
      color: var(--green-deep);
      font-weight: 700;
    }

    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(30px);
      background: var(--green-deep);
      color: #FFFFFF;
      padding: 11px 18px;
      border-radius: 30px;
      font-size: 13.5px;
      font-weight: 500;
      box-shadow: 0 8px 20px rgba(28, 84, 53, 0.25);
      opacity: 0;
      pointer-events: none;
      transition: all .28s cubic-bezier(0.16, 1, 0.3, 1);
      display: flex;
      align-items: center;
      gap: 8px;
      z-index: 1000;
      max-width: 90vw;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }
  </style>
</head>
<body>

  <div class="card">
    <!-- Dòng 1: Tiện ích nội bộ 1 -->
    <div class="kicker">
      <span>Tiện ích nội bộ 1</span>
    </div>

    <!-- Dòng 2: Tạo Mã QR PRD -->
    <h1>Tạo Mã QR PRD</h1>

    <!-- Dòng 3: Đường dẫn liên kết (URL): -->
    <div class="form-group">
      <label class="form-label" for="targetUrl">Đường dẫn liên kết (URL):</label>
      <input 
        type="url" 
        id="targetUrl" 
        class="form-input" 
        placeholder="https://www.google.com.vn" 
        value="https://www.google.com.vn"
        autocomplete="off"
      />
    </div>

    <!-- Dòng 4: Nội dung: -->
    <div class="form-group">
      <label class="form-label" for="targetContent">Nội dung:</label>
      <input 
        type="text" 
        id="targetContent" 
        class="form-input" 
        placeholder="Nhập nội dung mô tả hoặc tên tài liệu..." 
        value=""
      />
      
      <div class="filename-box">
        <span>Tên file tải về:</span>
        <span class="filename-highlight" id="previewFileName">Ma_QR_PRD.png</span>
      </div>
    </div>

    <div class="preview-container">
      <div class="canvas-wrapper">
        <canvas id="qrPreviewCanvas" width="460" height="460"></canvas>
      </div>
    </div>

    <!-- Nút hành động -->
    <div class="btn-group">
      <button class="btn btn-secondary" id="btnCopy" type="button">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
          <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
        </svg>
        Sao chép ảnh
      </button>

      <button class="btn btn-primary" id="btnDownload" type="button">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
          <polyline points="7 10 12 15 17 10"></polyline>
          <line x1="12" y1="15" x2="12" y2="3"></line>
        </svg>
        Tải ảnh PNG
      </button>
    </div>
  </div>

  <!-- Thông báo Toast -->
  <div id="toast" class="toast">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="20 6 9 17 4 12"></polyline>
    </svg>
    <span id="toastMsg">Thao tác thành công</span>
  </div>

  <!-- Canvas ẩn dùng cho việc xuất ảnh chất lượng in ấn 1024x1024px -->
  <canvas id="hiResCanvas" width="1024" height="1024" style="display:none;"></canvas>

  <script>
  /**
   * Bộ tạo mã QR Client-Side chuẩn ISO/IEC 18004.
   * Hỗ trợ đầy đủ Multi-Block Reed-Solomon Interleaving & Cấp sửa lỗi H (30%).
   */
  var QRCore = (function () {
    var QRMode = { MODE_8BIT_BYTE: 4 };
    var QRECL = { L: 1, M: 0, Q: 3, H: 2 };

    var QRMath = {
      glog: function (n) {
        if (n < 1) throw new Error("glog(" + n + ")");
        return QRMath.LOG_TABLE[n];
      },
      gexp: function (n) {
        while (n < 0) n += 255;
        while (n >= 255) n -= 255;
        return QRMath.EXP_TABLE[n];
      },
      EXP_TABLE: new Array(256),
      LOG_TABLE: new Array(256)
    };
    for (var i = 0; i < 8; i++) QRMath.EXP_TABLE[i] = 1 << i;
    for (var i = 8; i < 256; i++) QRMath.EXP_TABLE[i] = QRMath.EXP_TABLE[i - 4] ^ QRMath.EXP_TABLE[i - 5] ^ QRMath.EXP_TABLE[i - 6] ^ QRMath.EXP_TABLE[i - 8];
    for (var i = 0; i < 255; i++) QRMath.LOG_TABLE[QRMath.EXP_TABLE[i]] = i;

    function QRPolynomial(num, shift) {
      if (num.length == undefined) throw new Error(num.length + "/" + shift);
      var offset = 0;
      while (offset < num.length && num[offset] == 0) offset++;
      this.num = new Array(num.length - offset + shift);
      for (var i = 0; i < num.length - offset; i++) this.num[i] = num[i + offset];
      for (var i = 0; i < shift; i++) this.num[this.num.length - shift + i] = 0;
    }
    QRPolynomial.prototype = {
      get: function (index) { return this.num[index]; },
      getLength: function () { return this.num.length; },
      multiply: function (e) {
        var num = new Array(this.getLength() + e.getLength() - 1);
        for (var i = 0; i < num.length; i++) num[i] = 0;
        for (var i = 0; i < this.getLength(); i++) {
          for (var j = 0; j < e.getLength(); j++) {
            num[i + j] ^= QRMath.gexp(QRMath.glog(this.get(i)) + QRMath.glog(e.get(j)));
          }
        }
        return new QRPolynomial(num, 0);
      },
      mod: function (e) {
        if (this.getLength() - e.getLength() < 0) return this;
        var ratio = QRMath.glog(this.get(0)) - QRMath.glog(e.get(0));
        var num = new Array(this.getLength());
        for (var i = 0; i < this.getLength(); i++) num[i] = this.get(i);
        for (var i = 0; i < e.getLength(); i++) {
          num[i] ^= QRMath.gexp(QRMath.glog(e.get(i)) + ratio);
        }
        return new QRPolynomial(num, 0).mod(e);
      }
    };

    // Bảng cấu trúc khối RS chính xác cho Error Correction Level H (Cấp sửa lỗi cao nhất)
    var RS_BLOCK_TABLE_H = [
      [1, 26, 9],                     // v1
      [1, 44, 16],                    // v2
      [2, 35, 13],                    // v3: 2 blocks (35 total, 13 data)
      [4, 25, 9],                     // v4: 4 blocks (25 total, 9 data)
      [2, 33, 11, 2, 34, 12],         // v5: 2x(33,11) + 2x(34,12) = 46 data
      [4, 43, 15],                    // v6: 4 blocks (43 total, 15 data) = 60 data
      [4, 39, 13, 1, 40, 14],         // v7: 66 data
      [4, 40, 14, 2, 41, 15],         // v8: 86 data
      [4, 36, 12, 4, 37, 13],         // v9: 100 data
      [6, 43, 15, 2, 44, 16],         // v10: 122 data
      [6, 41, 12, 4, 42, 13],         // v11: 140 data
      [4, 45, 14, 6, 46, 15],         // v12: 158 data
      [8, 42, 12, 4, 43, 13],         // v13: 180 data
      [8, 44, 13, 4, 45, 14]          // v14: 198 data
    ];

    var QRRSBlock = {
      getRSBlocks: function (typeNumber) {
        var rsBlock = RS_BLOCK_TABLE_H[typeNumber - 1];
        if (!rsBlock) throw new Error("Vượt quá độ dài hỗ trợ của mã QR (Type " + typeNumber + ")");
        var length = rsBlock.length / 3;
        var list = [];
        for (var i = 0; i < length; i++) {
          var count = rsBlock[i * 3 + 0];
          var totalCount = rsBlock[i * 3 + 1];
          var dataCount = rsBlock[i * 3 + 2];
          for (var j = 0; j < count; j++) {
            list.push({ totalCount: totalCount, dataCount: dataCount });
          }
        }
        return list;
      }
    };

    function QRBitBuffer() {
      this.buffer = [];
      this.length = 0;
    }
    QRBitBuffer.prototype = {
      get: function (index) {
        var bufIndex = Math.floor(index / 8);
        return ((this.buffer[bufIndex] >>> (7 - index % 8)) & 1) == 1;
      },
      put: function (num, length) {
        for (var i = 0; i < length; i++) {
          this.putBit(((num >>> (length - i - 1)) & 1) == 1);
        }
      },
      putBit: function (bit) {
        var bufIndex = Math.floor(this.length / 8);
        if (this.buffer.length <= bufIndex) this.buffer.push(0);
        if (bit) this.buffer[bufIndex] |= (0x80 >>> (this.length % 8));
        this.length++;
      }
    };

    var QRUtil = {
      PATTERN_POSITION_TABLE: [
        [], [6, 18], [6, 22], [6, 26], [6, 30], [6, 34],
        [6, 22, 38], [6, 24, 42], [6, 26, 46], [6, 28, 50],
        [6, 30, 54], [6, 32, 58], [6, 34, 62], [6, 26, 46, 66]
      ],
      G15: (1 << 10) | (1 << 8) | (1 << 5) | (1 << 4) | (1 << 2) | (1 << 1) | (1 << 0),
      G15_MASK: (1 << 14) | (1 << 12) | (1 << 10) | (1 << 4) | (1 << 1),
      G18: (1 << 12) | (1 << 11) | (1 << 10) | (1 << 9) | (1 << 8) | (1 << 5) | (1 << 2) | (1 << 0),

      getBCHTypeInfo: function (data) {
        var d = data << 10;
        while (QRUtil.getBCHDigit(d) - QRUtil.getBCHDigit(QRUtil.G15) >= 0) {
          d ^= (QRUtil.G15 << (QRUtil.getBCHDigit(d) - QRUtil.getBCHDigit(QRUtil.G15)));
        }
        return ((data << 10) | d) ^ QRUtil.G15_MASK;
      },
      getBCHVersion: function (data) {
        var d = data << 12;
        while (QRUtil.getBCHDigit(d) - QRUtil.getBCHDigit(QRUtil.G18) >= 0) {
          d ^= (QRUtil.G18 << (QRUtil.getBCHDigit(d) - QRUtil.getBCHDigit(QRUtil.G18)));
        }
        return (data << 12) | d;
      },
      getBCHDigit: function (data) {
        var digit = 0;
        while (data != 0) { digit++; data >>>= 1; }
        return digit;
      },
      getPatternPosition: function (typeNumber) {
        return QRUtil.PATTERN_POSITION_TABLE[typeNumber - 1] || [];
      },
      getMask: function (maskPattern, i, j) {
        switch (maskPattern) {
          case 0: return (i + j) % 2 == 0;
          case 1: return i % 2 == 0;
          case 2: return j % 3 == 0;
          case 3: return (i + j) % 3 == 0;
          case 4: return (Math.floor(i / 2) + Math.floor(j / 3)) % 2 == 0;
          case 5: return (i * j) % 2 + (i * j) % 3 == 0;
          case 6: return ((i * j) % 2 + (i * j) % 3) % 2 == 0;
          case 7: return ((i * j) % 3 + (i + j) % 2) % 2 == 0;
          default: return false;
        }
      },
      getErrorCorrectPolynomial: function (errorCorrectLength) {
        var a = new QRPolynomial([1], 0);
        for (var i = 0; i < errorCorrectLength; i++) {
          a = a.multiply(new QRPolynomial([1, QRMath.gexp(i)], 0));
        }
        return a;
      },
      getLengthInBits: function (type) {
        return type < 10 ? 8 : 16;
      },
      getLostPoint: function (qrCode) {
        var moduleCount = qrCode.getModuleCount();
        var lostPoint = 0;
        for (var row = 0; row < moduleCount; row++) {
          var head = 0;
          for (var col = 0; col < moduleCount; col++) {
            var dark = qrCode.isDark(row, col);
            if (col == 0 || dark != qrCode.isDark(row, col - 1)) {
              head = 1;
            } else {
              head++;
              if (head == 5) lostPoint += 3;
              else if (head > 5) lostPoint++;
            }
          }
        }
        for (var col = 0; col < moduleCount; col++) {
          var head = 0;
          for (var row = 0; row < moduleCount; row++) {
            var dark = qrCode.isDark(row, col);
            if (row == 0 || dark != qrCode.isDark(row - 1, col)) {
              head = 1;
            } else {
              head++;
              if (head == 5) lostPoint += 3;
              else if (head > 5) lostPoint++;
            }
          }
        }
        for (var row = 0; row < moduleCount - 1; row++) {
          for (var col = 0; col < moduleCount - 1; col++) {
            var count = 0;
            if (qrCode.isDark(row, col)) count++;
            if (qrCode.isDark(row + 1, col)) count++;
            if (qrCode.isDark(row, col + 1)) count++;
            if (qrCode.isDark(row + 1, col + 1)) count++;
            if (count == 0 || count == 4) lostPoint += 3;
          }
        }
        return lostPoint;
      }
    };

    function QRCodeModel(typeNumber, errorCorrectLevel) {
      this.typeNumber = typeNumber;
      this.errorCorrectLevel = errorCorrectLevel;
      this.modules = null;
      this.moduleCount = 0;
      this.dataList = [];
    }

    QRCodeModel.prototype = {
      addData: function (data) {
        this.dataList.push({
          mode: QRMode.MODE_8BIT_BYTE,
          data: data,
          getLength: function () { return this.data.length; },
          write: function (buffer) {
            for (var i = 0; i < this.data.length; i++) {
              buffer.put(this.data.charCodeAt(i), 8);
            }
          }
        });
      },
      isDark: function (row, col) {
        if (row < 0 || this.moduleCount <= row || col < 0 || this.moduleCount <= col) return false;
        return this.modules[row][col];
      },
      getModuleCount: function () {
        return this.moduleCount;
      },
      make: function () {
        // Tự động tìm Type/Version nhỏ nhất chứa vừa dữ liệu
        if (this.typeNumber < 1) {
          var typeNumber = 1;
          for (typeNumber = 1; typeNumber <= 14; typeNumber++) {
            var rsBlocks = QRRSBlock.getRSBlocks(typeNumber);
            var totalDataCount = 0;
            for (var i = 0; i < rsBlocks.length; i++) totalDataCount += rsBlocks[i].dataCount;
            var buffer = new QRBitBuffer();
            for (var i = 0; i < this.dataList.length; i++) {
              var d = this.dataList[i];
              buffer.put(d.mode, 4);
              buffer.put(d.getLength(), QRUtil.getLengthInBits(typeNumber));
              d.write(buffer);
            }
            if (buffer.length <= totalDataCount * 8) break;
          }
          if (typeNumber > 14) throw new Error("Dữ liệu quá dài so với giới hạn tạo mã");
          this.typeNumber = typeNumber;
        }

        // Chọn mask tối ưu nhất
        var bestMask = 0;
        var minLostPoint = 0;
        for (var mask = 0; mask < 8; mask++) {
          this.makeImpl(true, mask);
          var lostPoint = QRUtil.getLostPoint(this);
          if (mask === 0 || minLostPoint > lostPoint) {
            minLostPoint = lostPoint;
            bestMask = mask;
          }
        }
        this.makeImpl(false, bestMask);
      },
      makeImpl: function (test, maskPattern) {
        this.moduleCount = this.typeNumber * 4 + 17;
        this.modules = new Array(this.moduleCount);
        for (var row = 0; row < this.moduleCount; row++) {
          this.modules[row] = new Array(this.moduleCount);
          for (var col = 0; col < this.moduleCount; col++) this.modules[row][col] = null;
        }
        this.setupPositionProbePattern(0, 0);
        this.setupPositionProbePattern(this.moduleCount - 7, 0);
        this.setupPositionProbePattern(0, this.moduleCount - 7);
        this.setupPositionAdjustPattern();
        this.setupTimingPattern();
        this.setupTypeInfo(test, maskPattern);
        if (this.typeNumber >= 7) {
          this.setupVersionInfo(test);
        }
        this.mapData(this.createData(this.typeNumber, this.errorCorrectLevel, this.dataList), maskPattern);
      },
      setupPositionProbePattern: function (row, col) {
        for (var r = -1; r <= 7; r++) {
          if (row + r <= -1 || this.moduleCount <= row + r) continue;
          for (var c = -1; c <= 7; c++) {
            if (col + c <= -1 || this.moduleCount <= col + c) continue;
            if ((0 <= r && r <= 6 && (c == 0 || c == 6)) || (0 <= c && c <= 6 && (r == 0 || r == 6)) || (2 <= r && r <= 4 && 2 <= c && c <= 4)) {
              this.modules[row + r][col + c] = true;
            } else {
              this.modules[row + r][col + c] = false;
            }
          }
        }
      },
      setupTimingPattern: function () {
        for (var r = 8; r < this.moduleCount - 8; r++) {
          if (this.modules[r][6] != null) continue;
          this.modules[r][6] = (r % 2 == 0);
        }
        for (var c = 8; c < this.moduleCount - 8; c++) {
          if (this.modules[6][c] != null) continue;
          this.modules[6][c] = (c % 2 == 0);
        }
      },
      setupPositionAdjustPattern: function () {
        var pos = QRUtil.getPatternPosition(this.typeNumber);
        for (var i = 0; i < pos.length; i++) {
          for (var j = 0; j < pos.length; j++) {
            var row = pos[i];
            var col = pos[j];
            if (this.modules[row][col] != null) continue;
            for (var r = -2; r <= 2; r++) {
              for (var c = -2; c <= 2; c++) {
                if (r == -2 || r == 2 || c == -2 || c == 2 || (r == 0 && c == 0)) {
                  this.modules[row + r][col + c] = true;
                } else {
                  this.modules[row + r][col + c] = false;
                }
              }
            }
          }
        }
      },
      setupTypeInfo: function (test, maskPattern) {
        var data = (this.errorCorrectLevel << 3) | maskPattern;
        var bits = QRUtil.getBCHTypeInfo(data);
        for (var i = 0; i < 15; i++) {
          var mod = (!test && ((bits >> i) & 1) == 1);
          if (i < 6) this.modules[i][8] = mod;
          else if (i < 8) this.modules[i + 1][8] = mod;
          else this.modules[this.moduleCount - 15 + i][8] = mod;
        }
        for (var i = 0; i < 15; i++) {
          var mod = (!test && ((bits >> i) & 1) == 1);
          if (i < 8) this.modules[8][this.moduleCount - i - 1] = mod;
          else if (i < 9) this.modules[8][15 - i] = mod;
          else this.modules[8][15 - i - 1] = mod;
        }
        this.modules[this.moduleCount - 8][8] = !test;
      },
      setupVersionInfo: function (test) {
        var bits = QRUtil.getBCHVersion(this.typeNumber);
        for (var i = 0; i < 18; i++) {
          var mod = (!test && ((bits >> i) & 1) == 1);
          this.modules[Math.floor(i / 3)][this.moduleCount - 11 + (i % 3)] = mod;
          this.modules[this.moduleCount - 11 + (i % 3)][Math.floor(i / 3)] = mod;
        }
      },
      mapData: function (data, maskPattern) {
        var inc = -1;
        var row = this.moduleCount - 1;
        var bitIndex = 7;
        var byteIndex = 0;
        for (var col = this.moduleCount - 1; col > 0; col -= 2) {
          if (col == 6) col--;
          while (true) {
            for (var c = 0; c < 2; c++) {
              if (this.modules[row][col - c] == null) {
                var dark = false;
                if (byteIndex < data.length) {
                  dark = (((data[byteIndex] >>> bitIndex) & 1) == 1);
                }
                var mask = QRUtil.getMask(maskPattern, row, col - c);
                if (mask) dark = !dark;
                this.modules[row][col - c] = dark;
                bitIndex--;
                if (bitIndex == -1) { byteIndex++; bitIndex = 7; }
              }
            }
            row += inc;
            if (row < 0 || this.moduleCount <= row) { row -= inc; inc = -inc; break; }
          }
        }
      },
      createData: function (typeNumber, errorCorrectLevel, dataList) {
        var rsBlocks = QRRSBlock.getRSBlocks(typeNumber);
        var buffer = new QRBitBuffer();
        for (var i = 0; i < dataList.length; i++) {
          var d = dataList[i];
          buffer.put(d.mode, 4);
          buffer.put(d.getLength(), QRUtil.getLengthInBits(typeNumber));
          d.write(buffer);
        }
        var totalDataCount = 0;
        for (var i = 0; i < rsBlocks.length; i++) totalDataCount += rsBlocks[i].dataCount;
        if (buffer.length > totalDataCount * 8) throw new Error("Dữ liệu quá dài so với giới hạn QR");
        if (buffer.length + 4 <= totalDataCount * 8) buffer.put(0, 4);
        while (buffer.length % 8 != 0) buffer.putBit(false);
        while (true) {
          if (buffer.length >= totalDataCount * 8) break;
          buffer.put(0xEC, 8);
          if (buffer.length >= totalDataCount * 8) break;
          buffer.put(0x11, 8);
        }
        return this.createBytes(buffer, rsBlocks);
      },
      createBytes: function (buffer, rsBlocks) {
        var offset = 0;
        var maxDcCount = 0;
        var maxEcCount = 0;
        var dcdata = new Array(rsBlocks.length);
        var ecdata = new Array(rsBlocks.length);
        for (var r = 0; r < rsBlocks.length; r++) {
          var dcCount = rsBlocks[r].dataCount;
          var ecCount = rsBlocks[r].totalCount - dcCount;
          maxDcCount = Math.max(maxDcCount, dcCount);
          maxEcCount = Math.max(maxEcCount, ecCount);
          dcdata[r] = new Array(dcCount);
          for (var i = 0; i < dcdata[r].length; i++) {
            dcdata[r][i] = 0xff & buffer.buffer[i + offset];
          }
          offset += dcCount;
          var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
          var rawPoly = new QRPolynomial(dcdata[r], rsPoly.getLength() - 1);
          var modPoly = rawPoly.mod(rsPoly);
          ecdata[r] = new Array(rsPoly.getLength() - 1);
          for (var i = 0; i < ecdata[r].length; i++) {
            var modIndex = i + modPoly.getLength() - ecdata[r].length;
            ecdata[r][i] = (modIndex >= 0) ? modPoly.get(modIndex) : 0;
          }
        }
        var totalCodeCount = 0;
        for (var i = 0; i < rsBlocks.length; i++) totalCodeCount += rsBlocks[i].totalCount;
        var data = new Array(totalCodeCount);
        var index = 0;
        // Đan xen dữ liệu Data Codewords
        for (var i = 0; i < maxDcCount; i++) {
          for (var r = 0; r < rsBlocks.length; r++) {
            if (i < dcdata[r].length) data[index++] = dcdata[r][i];
          }
        }
        // Đan xen dữ liệu Error Correction Codewords
        for (var i = 0; i < maxEcCount; i++) {
          for (var r = 0; r < rsBlocks.length; r++) {
            if (i < ecdata[r].length) data[index++] = ecdata[r][i];
          }
        }
        return data;
      }
    };

    return {
      generate: function (text) {
        var utf8String = unescape(encodeURIComponent(text));
        var qr = new QRCodeModel(0, QRECL.H);
        qr.addData(utf8String);
        qr.make();
        return qr;
      }
    };
  })();
  </script>

  <script>
  (function () {
    'use strict';

    var urlInput = document.getElementById('targetUrl');
    var contentInput = document.getElementById('targetContent');
    var previewCanvas = document.getElementById('qrPreviewCanvas');
    var hiResCanvas = document.getElementById('hiResCanvas');
    var btnDownload = document.getElementById('btnDownload');
    var btnCopy = document.getElementById('btnCopy');
    var toast = document.getElementById('toast');
    var toastMsg = document.getElementById('toastMsg');
    var previewFileName = document.getElementById('previewFileName');

    function getSafeFileName(content) {
      var raw = (content || '').trim();
      if (!raw) return 'Ma_QR_PRD.png';

      var words = raw.split(/\s+/).filter(Boolean);
      var selected = words.length > 15 ? words.slice(0, 15).join('_') : words.join('_');
      var clean = selected.replace(/[/\\?%*:|"<>#]/g, '').trim();
      return (clean || 'Ma_QR_PRD') + '.png';
    }

    function updateFileNamePreview() {
      previewFileName.textContent = getSafeFileName(contentInput.value);
    }

    function drawCenterLogo(ctx, cx, cy, size) {
      // Tỷ lệ vàng logo: 15% kích thước mã (an toàn 100% trong ngưỡng 30% sửa lỗi Level H)
      var logoSize = Math.round(size * 0.15);
      var r = logoSize / 2;
      var padding = Math.max(3, Math.round(size * 0.015)); // Đệm trắng cách ly pixel QR

      ctx.save();
      
      // 1. Vùng đệm trắng tròn tuyệt đối
      ctx.beginPath();
      ctx.arc(cx, cy, r + padding, 0, Math.PI * 2);
      ctx.fillStyle = '#FFFFFF';
      ctx.fill();

      // Viền đệm thanh lịch
      ctx.lineWidth = Math.max(1.5, Math.round(size * 0.003));
      ctx.strokeStyle = '#E0E8DC';
      ctx.stroke();

      // 2. Mặt nạ tròn bên trong
      ctx.beginPath();
      ctx.arc(cx, cy, r, 0, Math.PI * 2);
      ctx.closePath();
      ctx.clip();

      // Gradient nền xanh thảo mộc PRD
      var grad = ctx.createLinearGradient(cx - r, cy - r, cx + r, cy + r);
      grad.addColorStop(0, '#154129');
      grad.addColorStop(1, '#276842');
      ctx.fillStyle = grad;
      ctx.fillRect(cx - r, cy - r, logoSize, logoSize);

      // Vòng tròn trang trí mảnh
      ctx.beginPath();
      ctx.arc(cx, cy, r * 0.88, 0, Math.PI * 2);
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.45)';
      ctx.lineWidth = Math.max(1.2, Math.round(size * 0.0025));
      ctx.stroke();

      // Chữ PRD thương hiệu
      ctx.fillStyle = '#FFFFFF';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.font = 'bold ' + Math.round(r * 0.92) + 'px "Segoe UI", Roboto, Arial, sans-serif';
      ctx.fillText('PRD', cx, cy + Math.round(r * 0.02));

      ctx.restore();
    }

    function renderQRToCanvas(targetCanvas, text, renderSize) {
      try {
        var qr = QRCore.generate(text);
        var moduleCount = qr.getModuleCount();

        targetCanvas.width = renderSize;
        targetCanvas.height = renderSize;

        var ctx = targetCanvas.getContext('2d');
        if (!ctx) return;

        // Nền trắng tinh khiết
        ctx.fillStyle = '#FFFFFF';
        ctx.fillRect(0, 0, renderSize, renderSize);

        // Vùng an toàn Quiet Zone 4 modules theo tiêu chuẩn quốc tế
        var marginModules = 4;
        var totalModules = moduleCount + marginModules * 2;
        var tileSize = Math.floor(renderSize / totalModules);
        var offset = Math.round((renderSize - totalModules * tileSize) / 2);

        // Màu đen thảo mộc sâu (#051209) tương phản cực đại, giúp mọi camera đọc nhạy ngay lập tức
        ctx.fillStyle = '#051209';
        for (var r = 0; r < moduleCount; r++) {
          for (var c = 0; c < moduleCount; c++) {
            if (qr.isDark(r, c)) {
              var x = offset + (c + marginModules) * tileSize;
              var y = offset + (r + marginModules) * tileSize;
              ctx.fillRect(x, y, tileSize, tileSize);
            }
          }
        }

        // Vẽ logo PRD căn giữa tâm chính xác
        var centerPos = renderSize / 2;
        drawCenterLogo(ctx, centerPos, centerPos, renderSize);

      } catch (err) {
        console.error('Lỗi khi vẽ mã QR:', err);
        showToast('Lỗi: ' + (err.message || 'Không thể tạo mã'));
      }
    }

    function updatePreview() {
      var url = (urlInput.value || '').trim();
      if (!url) url = 'https://daotao.congty.vn/prd';
      renderQRToCanvas(previewCanvas, url, 460);
      updateFileNamePreview();
    }

    function showToast(message) {
      toastMsg.textContent = message;
      toast.classList.add('show');
      setTimeout(function () {
        toast.classList.remove('show');
      }, 3200);
    }

    btnDownload.addEventListener('click', function () {
      var url = (urlInput.value || '').trim();
      var content = (contentInput.value || '').trim();
      if (!url) {
        showToast('Vui lòng nhập đường dẫn liên kết URL');
        return;
      }

      btnDownload.disabled = true;
      var originalText = btnDownload.innerHTML;
      btnDownload.innerHTML = 'Đang xuất...';

      setTimeout(function () {
        try {
          renderQRToCanvas(hiResCanvas, url, 1024);
          var fileName = getSafeFileName(content);
          var dataUrl = hiResCanvas.toDataURL('image/png');

          var a = document.createElement('a');
          a.download = fileName;
          a.href = dataUrl;
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);

          showToast('Đã tải: ' + fileName);
        } catch (e) {
          showToast('Lỗi xuất file: ' + (e.message || e));
        } finally {
          btnDownload.disabled = false;
          btnDownload.innerHTML = originalText;
        }
      }, 60);
    });

    btnCopy.addEventListener('click', function () {
      var url = (urlInput.value || '').trim();
      if (!url) {
        showToast('Vui lòng nhập đường dẫn URL');
        return;
      }

      renderQRToCanvas(hiResCanvas, url, 1024);

      if (navigator.clipboard && window.ClipboardItem) {
        hiResCanvas.toBlob(function (blob) {
          if (!blob) {
            showToast('Không thể tạo định dạng ảnh sao chép.');
            return;
          }
          navigator.clipboard.write([
            new ClipboardItem({ 'image/png': blob })
          ]).then(function () {
            showToast('Đã sao chép ảnh QR vào bộ nhớ tạm!');
          }).catch(function () {
            showToast('Trình duyệt chặn sao chép, hãy dùng nút Tải.');
          });
        }, 'image/png');
      } else {
        showToast('Trình duyệt chưa hỗ trợ sao chép ảnh trực tiếp.');
      }
    });

    urlInput.addEventListener('input', updatePreview);
    contentInput.addEventListener('input', updateFileNamePreview);

    updatePreview();
  })();
  </script>
</body>
</html>
